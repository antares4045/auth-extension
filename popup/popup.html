<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Auth Injector</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="tab-bar material-popup">
        <!-- Вкладки Material -->
        <div class="material-tabs">
            <button class="tab-button material-tab active" data-tab="instances">Настройки</button>
            <button class="tab-button material-tab" data-tab="report" id="reportTabBtn" style="display: none;">Управление</button>
        </div>

        <!-- Содержимое вкладки "Настройки" -->
        <div id="instances-tab" class="tab-content material-tab-pane">
            <div class="material-subtitle">Автологин для:</div>
            <div id="instances-list" class="material-list"></div>
            <button id="add-instance" class="material-button material-button-primary">+ Добавить инстанс</button>
            <div class="material-card settings-transfer-card">
                <div class="material-subtitle">Резервная копия</div>
                <div class="material-card-description">Файл содержит все sync-настройки, хоткей, логины и пароли. Храните его в безопасном месте.</div>
                <div class="settings-transfer-actions">
                    <button id="export-settings-btn" class="material-button material-button-primary" type="button">Экспорт</button>
                    <button id="import-settings-btn" class="material-button material-button-secondary" type="button">Импорт</button>
                </div>
                <input id="import-settings-file" type="file" accept="application/json,.json" hidden>
                <div id="settings-transfer-status" class="material-inline-status settings-transfer-status" aria-live="polite"></div>
                <button id="apply-imported-shortcut-btn" class="material-text-button" type="button" hidden>Настроить хоткей</button>
            </div>
        </div>

        <!-- Содержимое вкладки "Управление" -->
        <div id="report-tab" class="tab-content material-tab-pane">
            <div class="material-subtitle">Переключение настройки</div>
            <div class="material-card">
                <div class="material-state-row">
                    <span class="material-label">Текущее состояние:</span>
                    <span id="current-state" class="material-state-badge">Загрузка...</span>
                </div>
                <button id="toggle-state-btn" class="material-button material-button-secondary" disabled>Переключить</button>
            </div>
            <div class="material-card formula-browser-card">
                <div class="material-subtitle">Анализ формул</div>
                <div class="material-card-description">Переменные, зависимости и источники данных</div>
                <button id="open-formula-browser-btn" class="material-button material-button-primary material-button-block">Открыть браузер формул</button>
                <div id="formula-browser-status" class="material-inline-status" aria-live="polite"></div>
                <div class="formula-shortcut-row">
                    <span id="formula-browser-shortcut">Хоткей: Alt+V</span>
                    <button id="configure-shortcuts-btn" class="material-text-button" type="button">Настроить</button>
                </div>
            </div>
        </div>
    </div>
    <script src="settings-transfer.js"></script>
    <script src="popup.js"></script>
</body>
</html>
